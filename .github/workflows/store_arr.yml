name: Storage QC daily

on:
  schedule:
    # 05:30 UTC = 08:30 KSA, after the morning checklists are submitted
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Specific date, YYYYMMDD (blank = yesterday)"
        required: false
        default: ""

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # WeasyPrint rendering libs; fonts-noto covers the Arabic table
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info \
            fonts-noto fonts-noto-core

      # DINOv2 weights are ~350MB; cached after the first run
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-dinov2-base-v1

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers joblib scikit-learn numpy pillow \
                      requests pytz weasyprint python-docx

      - name: Build and send report
        env:
          ZENPUT_TOKEN:   ${{ secrets.ZENPUT_TOKEN }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          REPORT_DATE:    ${{ github.event.inputs.report_date }}
          DAY_OFFSET:     "1"
        run: python main.py

      - name: Keep the outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-report
          path: reports/
          retention-days: 30
